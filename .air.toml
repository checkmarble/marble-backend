#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = ".air-build"

[build]
include_dir = []
include_ext = ["go", "sql"]
include_file = []
exclude_dir = [
  "contrib",
  "firebase-local-data",
  "integration_test",
  "mocks",
  "specs",
  "tempFiles",
]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
args_bin = []
bin = "./.air-build/main"
cmd = "go build -o ./.air-build/main ."
delay = 1000
entrypoint = ["./.air-build/main"]
full_bin = ""
ignore_dangerous_root_dir = false
kill_delay = "0s"
log = "build-errors.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = []
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = false

[color]
app = ""
build = "yellow"
main = "magenta"
mode = ""
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = false

[misc]
clean_on_exit = false

[proxy]
app_port = 0
app_start_timeout = 0
enabled = false
proxy_port = 0

[screen]
clear_on_rebuild = false
keep_scroll = true

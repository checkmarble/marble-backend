[tools]
go = "1.27.1" # Sources of truth are in go.mod, the Dockerfile and integration_test/screening/tests/marble/build.ts
golangci-lint = "2.13.1" # Sources of truth are in .github/workflows/*.yaml
"go:github.com/pressly/goose/v3/cmd/goose" = "3.28.0"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:golang.org/x/tools/gopls" = "latest"

[env]
_.file = '.env'

[tasks.migrate]
dir = "repositories/migrations"
env.GOOSE_DBSTRING = "$PG_CONNECTION_STRING"
run = "goose postgres up"

[tasks.migrate-down]
dir = "repositories/migrations"
env.GOOSE_DBSTRING = "$PG_CONNECTION_STRING"
run = "goose postgres down"
